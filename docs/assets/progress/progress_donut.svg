<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="680" height="400" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <linearGradient id="progress-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="660" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#card-shadow)" />

  <!-- Donut Ring Background (Remaining) -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="#f1f5f9" stroke-width="32" />

  <!-- Donut Ring Progress (Completed) -->
  <circle cx="200" cy="200" r="130" fill="none" stroke="url(#progress-grad)" stroke-width="32"
          stroke-dasharray="816.814"
          stroke-dashoffset="790.359"
          stroke-linecap="round"
          transform="rotate(-90 200 200)" />

  <!-- Center Text -->
  <text x="200" y="188" text-anchor="middle" font-size="44" font-weight="800" fill="#0f172a">3.24 %</text>
  <text x="200" y="222" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1">AVANCEMENT GLOBAL</text>
  <text x="200" y="242" text-anchor="middle" font-size="12" font-weight="500" fill="#94a3b8">8 / 247 sous-tâches</text>

  <!-- Right Panel Info -->
  <g transform="translate(400, 70)">
    <!-- Header -->
    <text x="0" y="0" font-size="18" font-weight="700" fill="#0f172a">Synthèse du Projet</text>
    <text x="0" y="20" font-size="12" font-weight="500" fill="#64748b">Wargame Géospatial PFE — Promotion 2026-2027</text>

    <!-- Stat 1: Completed -->
    <g transform="translate(0, 50)">
      <circle cx="10" cy="10" r="7" fill="#2563eb" />
      <text x="26" y="14" font-size="14" font-weight="600" fill="#1e293b">Sous-tâches terminées</text>
      <text x="230" y="14" font-size="15" font-weight="700" fill="#2563eb" text-anchor="end">8</text>
      <rect x="0" y="24" width="230" height="1" fill="#f1f5f9" />
    </g>

    <!-- Stat 2: Remaining -->
    <g transform="translate(0, 85)">
      <circle cx="10" cy="10" r="7" fill="#cbd5e1" />
      <text x="26" y="14" font-size="14" font-weight="600" fill="#1e293b">Sous-tâches restantes</text>
      <text x="230" y="14" font-size="15" font-weight="700" fill="#64748b" text-anchor="end">239</text>
      <rect x="0" y="24" width="230" height="1" fill="#f1f5f9" />
    </g>

    <!-- Stat 3: Total -->
    <g transform="translate(0, 120)">
      <circle cx="10" cy="10" r="7" fill="#0f172a" />
      <text x="26" y="14" font-size="14" font-weight="600" fill="#1e293b">Total des sous-tâches</text>
      <text x="230" y="14" font-size="15" font-weight="700" fill="#0f172a" text-anchor="end">247</text>
      <rect x="0" y="24" width="230" height="1" fill="#f1f5f9" />
    </g>

    <!-- Stat 4: Active Step -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="230" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <text x="12" y="20" font-size="11" font-weight="700" fill="#3b82f6" letter-spacing="0.5">ÉTAPE ACTIVE</text>
      <text x="12" y="42" font-size="13" font-weight="700" fill="#0f172a">ÉTAPE 01 — Analyse détaillée du...</text>
    </g>
  </g>
</svg>
